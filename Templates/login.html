<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SmartPoll</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 flex items-center justify-center h-screen">
    <div class="bg-gray-800 p-8 rounded-lg shadow-xl w-96 border border-gray-700">
        <h2 class="text-3xl font-bold text-white mb-6 text-center">Host Login</h2>
        <form action="/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-gray-400 mb-1">Username</label>
                <input type="text" name="username" required 
                       class="w-full p-3 rounded bg-gray-700 text-white border border-gray-600 focus:border-blue-500 outline-none">
            </div>
            <div>
                <label class="block text-gray-400 mb-1">Password</label>
                <input type="password" name="password" required 
                       class="w-full p-3 rounded bg-gray-700 text-white border border-gray-600 focus:border-blue-500 outline-none">
            </div>
            <button type="submit" 
                    class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded transition duration-200">
                Login
            </button>
        </form>
        <p class="text-gray-400 mt-4 text-center text-sm">
            New host? <a href="/register" class="text-blue-400 hover:underline">Register account</a>
        </p>
    </div>
</body>
</html>
