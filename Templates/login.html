<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SmartPoll</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { 
            theme: { 
                extend: { 
                    colors: { primary: '#7F77DD', dark: '#0F0F0F', card: '#1A1A1A', border: '#2A2A2A' } 
                } 
            } 
        }
    </script>
</head>
<body class="bg-dark flex items-center justify-center h-screen font-sans">
    <div class="bg-card p-8 rounded-3xl shadow-2xl w-full max-w-md border border-border">
        
        <div class="text-center mb-8">
            <div class="text-2xl font-bold italic mb-2">Smart<span class="text-primary">Poll</span></div>
            <h2 class="text-xl font-bold text-white">Welcome Back</h2>
            <p class="text-gray-500 text-sm">Login to manage your live polls</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <div class="mb-6 space-y-2">
              {% for category, message in messages %}
                <div class="flex items-center gap-3 p-4 rounded-2xl text-sm font-bold
                    {% if category == 'error' %}
                        bg-red-500/10 border border-red-500/20 text-red-400
                    {% else %}
                        bg-green-500/10 border border-green-500/20 text-green-400
                    {% endif %}">
                  <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                  {{ message }}
                </div>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <form action="/login" method="POST" class="space-y-5">
            <div>
                <label class="block text-gray-500 text-xs font-bold uppercase tracking-widest mb-2 px-1">Username</label>
                <input type="text" name="username" placeholder="Enter your username" required 
                       class="w-full p-4 rounded-2xl bg-dark text-white border border-border focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-gray-700">
            </div>
            <div>
                <label class="block text-gray-500 text-xs font-bold uppercase tracking-widest mb-2 px-1">Password</label>
                <input type="password" name="password" placeholder="••••••••" required 
                       class="w-full p-4 rounded-2xl bg-dark text-white border border-border focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-gray-700">
            </div>
            
            <button type="submit" 
                    class="w-full bg-primary hover:bg-[#6b63c4] text-white font-bold py-4 rounded-2xl transition-all transform active:scale-[0.98] shadow-lg shadow-primary/20">
                Login
            </button>
        </form>

        <div class="mt-8 pt-6 border-t border-border text-center">
            <p class="text-gray-500 text-sm">
                New host? <a href="/register" class="text-primary font-bold hover:underline">Create an account</a>
            </p>
        </div>
    </div>
</body>
</html>
