<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartPoll | Host Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        tailwind.config = { 
            theme: { 
                extend: { 
                    colors: { 
                        royal: '#4F46E5', 
                        royalDeep: '#3730A3',
                        surface: '#1E1B4B', /* Deep Navy surface */
                        dark: '#0F172A'
                    } 
                } 
            } 
        }
    </script>
    <style>
        .header-gradient {
            background: linear-gradient(135deg, #3730A3 0%, #4F46E5 100%);
            height: 220px;
            border-bottom-left-radius: 40px;
            border-bottom-right-radius: 40px;
        }
        .glass-panel {
            background: #FFFFFF;
            border: 1px solid #E2E8F0;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }
        input::placeholder { color: #94A3B8; }
    </style>
</head>
<body class="bg-[#F8FAFC] text-slate-900 min-h-screen font-sans">

    <div class="fixed top-0 left-0 w-full header-gradient -z-10 shadow-lg"></div>

    <div class="max-w-4xl mx-auto px-6">
        <div class="flex justify-between items-center bg-white p-5 rounded-[2rem] border border-slate-100 shadow-xl mt-8 mb-6">
            <div class="flex gap-8 px-2">
                <div>
                    <p class="text-[10px] text-slate-400 uppercase font-black tracking-[0.2em]">Room Code</p>
                    <h1 id="roomDisp" class="text-3xl font-black text-royal tracking-tighter">------</h1>
                </div>
                <div class="border-l border-slate-100 pl-8">
                    <p class="text-[10px] text-slate-400 uppercase font-black tracking-[0.2em]">Live Voters</p>
                    <h2 id="participantCount" class="text-3xl font-black text-emerald-500">0</h2>
                </div>
            </div>

            <div class="flex gap-2">
                <button onclick="createNewPoll()" class="bg-slate-50 text-slate-600 px-4 py-2.5 rounded-xl text-[10px] font-black uppercase tracking-widest hover:bg-slate-100 transition-all">
                    Reset
                </button>
                <a href="/logout" class="bg-rose-50 text-rose-500 px-4 py-2.5 rounded-xl text-[10px] font-black uppercase tracking-widest hover:bg-rose-100 transition-all">
                    Logout
                </a>
            </div>
        </div>

        <div id="setup" class="bg-white p-8 rounded-[2.5rem] border border-slate-100 shadow-2xl mb-12">
            <div class="flex justify-between items-center mb-6">
                <h2 id="setupTitle" class="text-xl font-black text-slate-800 uppercase tracking-tight">Create Question 1</h2>
                <button id="copyBtn" onclick="copyVoteLink()" class="hidden text-[10px] font-bold bg-royal/10 text-royal px-4 py-1.5 rounded-full hover:bg-royal hover:text-white transition-all">
                    COPY VOTER LINK 🔗
                </button>
            </div>
            
            <input type="text" id="qIn" placeholder="Enter your question here..." 
                   class="w-full bg-slate-50 border border-slate-100 p-5 rounded-2xl mb-4 outline-none focus:border-royal/50 text-lg font-medium transition-all">
            
            <div id="optsList" class="space-y-3 mb-6"></div>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                <button onclick="addOpt()" class="bg-slate-100 text-slate-600 px-4 py-4 rounded-2xl text-[10px] font-black uppercase tracking-widest hover:bg-slate-200 transition-all">
                    + Add Option
                </button>
                <button onclick="saveQ()" class="bg-slate-900 text-white px-4 py-4 rounded-2xl text-[10px] font-black uppercase tracking-widest hover:bg-black transition-all">
                    Save Question
                </button>
                <button onclick="start()" class="bg-royal text-white px-4 py-4 rounded-2xl text-[10px] font-black uppercase tracking-widest shadow-lg shadow-royal/20 hover:bg-royalDeep transition-all">
                    Launch Poll
                </button>
            </div>
            <div id="qQueue" class="mt-6 flex flex-wrap gap-2"></div>
        </div>

        <div id="live" class="hidden mb-12">
            <div class="flex items-center gap-3 mb-8">
                <div class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></div>
                <h2 class="text-2xl font-black tracking-tighter text-slate-800">Live Results Feed</h2>
            </div>
            <div id="dashboardGrid" class="grid gap-4"></div>
        </div>
    </div>

    <script>
        const socket = io();
        let roomCode = "";
        let questions = [];

        window.onload = async () => {
            let activeCode = localStorage.getItem('active_room_code');
            if (activeCode) {
                const res = await fetch(`/get_room_state/${activeCode}`);
                if (res.ok) {
                    const data = await res.json();
                    roomCode = activeCode;
                    document.getElementById('roomDisp').innerText = roomCode;
                    document.getElementById('copyBtn').classList.remove('hidden');
                    socket.emit('join', {room: roomCode, type: 'host'});
                    if (data.questions.length > 0) {
                        questions = data.questions;
                        showLiveDashboard();
                        updateUI(data.report);
                    }
                } else { createNewRoom(); }
            } else { createNewRoom(); }
        };

        async function createNewRoom() {
            const res = await fetch('/create_room', {method:'POST'});
            const data = await res.json();
            roomCode = data.code;
            document.getElementById('roomDisp').innerText = roomCode;
            document.getElementById('copyBtn').classList.remove('hidden');
            localStorage.setItem('active_room_code', roomCode);
            socket.emit('join', {room: roomCode, type: 'host'});
            document.getElementById('optsList').innerHTML = "";
            addOpt(); addOpt();
        }

        socket.on('user_count', d => {
            document.getElementById('participantCount').innerText = d.count;
        });

        socket.on('update_dashboard', report => updateUI(report));

        function createNewPoll() {
            if (confirm("Reset everything? This generates a new room code.")) {
                localStorage.removeItem('active_room_code');
                questions = [];
                document.getElementById('live').classList.add('hidden');
                document.getElementById('setup').classList.remove('hidden');
                document.getElementById('qQueue').innerHTML = "";
                document.getElementById('qIn').value = "";
                document.getElementById('setupTitle').innerText = "Create Question 1";
                createNewRoom();
            }
        }

        function copyVoteLink() {
            const link = `${window.location.origin}/vote?room=${roomCode}`;
            navigator.clipboard.writeText(link);
            alert("Voter link copied!");
        }

        function addOpt() {
            const div = document.createElement('div');
            div.className = "flex gap-3 opt-row animate-in fade-in slide-in-from-bottom-2 duration-300";
            div.innerHTML = `
                <input type="text" placeholder="Option Text" class="opt-text flex-1 bg-slate-50 border border-slate-100 p-4 rounded-xl focus:border-royal/30 outline-none">
                <input type="number" placeholder="Jump To Q#" class="opt-next w-32 bg-slate-50 border border-slate-100 p-4 rounded-xl text-royal font-bold text-center focus:border-royal/30 outline-none">
            `;
            document.getElementById('optsList').appendChild(div);
        }

        function saveQ() {
            const text = document.getElementById('qIn').value.trim();
            const optRows = document.querySelectorAll('.opt-row');
            const opts = Array.from(optRows).map(row => ({
                label: row.querySelector('.opt-text').value.trim(),
                next: row.querySelector('.opt-next').value !== "" ? parseInt(row.querySelector('.opt-next').value) - 1 : null
            })).filter(o => o.label !== "");

            if (!text || opts.length < 2) return alert("Requires question and 2+ options");

            questions.push({text, options: opts});
            document.getElementById('qIn').value = "";
            document.getElementById('optsList').innerHTML = "";
            addOpt(); addOpt();
            document.getElementById('setupTitle').innerText = `Create Question ${questions.length + 1}`;
            document.getElementById('qQueue').innerHTML += `<span class="bg-royal text-white px-4 py-1.5 rounded-full text-[10px] font-black tracking-widest">Q${questions.length}</span>`;
        }

        async function start() {
            if (questions.length === 0) return alert("Save a question first!");
            await fetch('/start_poll', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({code: roomCode, questions})
            });
            showLiveDashboard();
        }

        function showLiveDashboard() {
            document.getElementById('setup').classList.add('hidden');
            document.getElementById('live').classList.remove('hidden');
            document.getElementById('dashboardGrid').innerHTML = questions.map((q, i) => `
                <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm">
                    <div class="flex items-center gap-3 mb-6">
                         <span class="bg-slate-100 text-slate-500 w-8 h-8 rounded-lg flex items-center justify-center font-bold text-xs">${i+1}</span>
                         <h3 class="font-black text-slate-800 text-lg tracking-tight">${q.text}</h3>
                    </div>
                    <div id="q-container-${i}" class="space-y-4"></div>
                </div>
            `).join('');
        }

        function updateUI(report) {
            if (!report) return;
            questions.forEach((q, qIdx) => {
                const container = document.getElementById(`q-container-${qIdx}`);
                if (!container) return;
                const qVotes = report[qIdx] || {};
                const total = Object.values(qVotes).reduce((a,b) => a+b, 0);
                
                container.innerHTML = q.options.map(opt => {
                    const count = qVotes[opt.label] || 0;
                    const pct = total > 0 ? (count/total * 100) : 0;
                    return `
                        <div>
                            <div class="text-[10px] font-black uppercase tracking-widest flex justify-between mb-2 text-slate-400">
                                <span>${opt.label}</span>
                                <span class="text-royal">${count} votes (${Math.round(pct)}%)</span>
                            </div>
                            <div class="w-full bg-slate-100 h-3 rounded-full overflow-hidden">
                                <div class="bg-royal h-full rounded-full transition-all duration-700 ease-out" style="width:${pct}%"></div>
                            </div>
                        </div>
                    `;
                }).join('');
            });
        }
    </script>
</body>
</html>
